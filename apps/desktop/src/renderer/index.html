<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trade Mate</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <img src="../assets/icon.png" alt="" class="brand-logo" />
        <div>
          <div class="brand-name">Trade Mate</div>
          <div class="brand-sub">OI Sniper engine</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="engine-card" id="engine-card"></div>
        <div class="version" id="version"></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="title">Dashboard</h1>
          <p id="subtitle" class="muted"></p>
        </div>
        <div class="topbar-right" id="topbar-right"></div>
      </header>
      <section class="content" id="content">
        <div id="panel-host" class="panel-host"></div>
        <div id="page" class="page" hidden></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
